<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" role="img" aria-label="小屋的小兽">
  <title>小屋的小兽 · 有点困了</title>
  <defs>
    <style>
      .breathe { transform-origin: 7.5px 11px; animation: breathe 5.2s ease-in-out infinite; }
      .z { animation: z 3.6s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.035,.965) translateY(.5px); } }
      @keyframes z { 0% { opacity: 0; transform: translateY(.8px); } 35% { opacity: .9; } 100% { opacity: 0; transform: translateY(-1.8px); } }
      @media (prefers-reduced-motion: reduce) { .breathe, .z { animation: none; } }
    </style>
  </defs>
  <ellipse cx="7.5" cy="15.2" rx="4.3" ry=".85" fill="#2C2A28" opacity=".13"/>
  <g class="z" stroke="#9FB6AE" stroke-width=".7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.6 4.4h1.9l-1.9 2.2h1.9"/>
  </g>
  <g class="breathe">
    <rect x="2.6" y="5.4" width="9.8" height="9" rx="4.4" fill="#8FA9A0"/>
    <ellipse cx="7.5" cy="11.6" rx="3" ry="2.5" fill="#F4EFE6" opacity=".92"/>
    <ellipse cx="1.9" cy="10.6" rx="1.1" ry="1.5" fill="#7A948C"/>
    <ellipse cx="13.1" cy="10.6" rx="1.1" ry="1.5" fill="#7A948C"/>
    <rect x="4.2" y="13.3" width="2.2" height="1.6" rx=".8" fill="#7A948C"/>
    <rect x="8.6" y="13.3" width="2.2" height="1.6" rx=".8" fill="#7A948C"/>
    <g stroke="#2C2A28" stroke-width=".55" fill="none" stroke-linecap="round">
      <path d="M4.5 8.7h2"/>
      <path d="M8.5 8.7h2"/>
    </g>
    <g fill="#2C2A28">
      <circle cx="5.5" cy="9.6" r=".42"/>
      <circle cx="9.5" cy="9.6" r=".42"/>
    </g>
  </g>
