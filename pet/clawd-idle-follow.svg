<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500" role="img" aria-label="小屋的小兽">
  <title>小屋的小兽 · 安静地看着你</title>
  <defs>
    <style>
      .breathe { transform-origin: 7.5px 11px; animation: breathe 3.6s ease-in-out infinite; }
      .blink   { transform-origin: 7.5px 8.6px; animation: blink 4.4s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.03,.97) translateY(.35px); } }
      @keyframes blink   { 0%,7%,100% { transform: scaleY(1); } 3.5% { transform: scaleY(.12); } }
      @media (prefers-reduced-motion: reduce) { .breathe, .blink { animation: none; } }
    </style>
  </defs>
  <ellipse cx="7.5" cy="15.2" rx="4.3" ry=".85" fill="#2C2A28" opacity=".13"/>
  <g class="breathe">
    <rect x="2.6" y="5.4" width="9.8" height="9" rx="4.4" fill="#8FA9A0"/>
    <ellipse cx="7.5" cy="11.6" rx="3" ry="2.5" fill="#F4EFE6" opacity=".92"/>
    <ellipse cx="1.9" cy="10.4" rx="1.1" ry="1.5" fill="#7A948C"/>
    <ellipse cx="13.1" cy="10.4" rx="1.1" ry="1.5" fill="#7A948C"/>
    <rect x="4.2" y="13.3" width="2.2" height="1.6" rx=".8" fill="#7A948C"/>
    <rect x="8.6" y="13.3" width="2.2" height="1.6" rx=".8" fill="#7A948C"/>
    <g class="blink" fill="#2C2A28">
      <circle cx="5.5" cy="8.6" r=".95"/>
      <circle cx="9.5" cy="8.6" r=".95"/>
    </g>
  </g>
</svg>
